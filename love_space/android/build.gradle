allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// AGP 8.9+ 不再为插件子项目自动注入 flutter ext 属性
subprojects {
    if (project.name != "app") {
        project.ext {
            flutter = [
                compileSdkVersion: 36,
                minSdkVersion    : 21,
                targetSdkVersion : 35,
            ]
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

// 强制所有子项目 compileSdk >= 34（isar_flutter_libs 需要 android:attr/lStar）
subprojects {
    def applyCompileSdkFix = { proj ->
        def android = proj.extensions.findByName("android")
        if (android != null) {
            if (android.compileSdk == null || android.compileSdk < 34) {
                android.compileSdk = 34
            }
            if (android.namespace == null) {
                def manifestFile = file("${proj.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlParser().parse(manifestFile)
                    android.namespace = manifest.@package
                }
            }
        }
    }
    if (project.state.executed) {
        applyCompileSdkFix(project)
    } else {
        afterEvaluate { applyCompileSdkFix(project) }
    }
}

// 部分插件未声明 compileOptions，AGP 默认 Java 8 —— 在 JDK 21 下会触发
// "源值 8 已过时" 警告（Java 8 已进入弃用通道）。在 javac 执行前，仅将
// 仍停留在 1.8 的编译任务提升到 11；已显式设置 11/17 的项目保持不变
// （避免与其 Kotlin jvmTarget 不一致导致构建失败）。
subprojects {
    tasks.withType(JavaCompile).configureEach { compileTask ->
        compileTask.doFirst {
            if (compileTask.sourceCompatibility == '1.8') {
                compileTask.sourceCompatibility = '11'
                compileTask.targetCompatibility = '11'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
