name: love_space
description: "以越之名 · 情侣恋爱空间"
publish_to: 'none'

version: 1.4.0+140

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 本地数据库
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0

  # 图片选择
  image_picker: ^1.1.2

  # 音乐播放
  just_audio: ^0.9.43
  on_audio_query: ^2.9.0

  # 小说爬虫
  http: ^1.2.1
  html: ^0.15.4
  charset: ^2.0.1  # GBK 编码支持（笔趣阁站点使用 GBK）

  # 阅读器屏幕常亮
  wakelock_plus: ^1.2.8

  # 双人同步状态持久化（配对房间码/用户 ID）
  shared_preferences: ^2.3.0

  # 应用内更新（读取当前版本、比较版本、校验安装包）
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.0
  crypto: ^3.0.7

  # 本地化（中文日期选择器）
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 代码生成
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
