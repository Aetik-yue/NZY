name: love_space
description: "以越之名 · 情侣恋爱空间"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.0

  # 本地存储
  shared_preferences: ^2.3.0

  # 字体
  # 图片
  cached_network_image: ^3.4.1

  # 工具
  intl: ^0.20.2
  uuid: ^4.4.2

  # 本地数据库
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0

  # 图片选择
  image_picker: ^1.1.2

  # 本地化（中文日期选择器）
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 代码生成
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
